<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>De viaje · U, V y T</title>
<style>
:root{--bg:#f6f8f9;--tx:#1d2b33;--card:#fff;--ln:#9aa9b2;--c:#0f7b7b;--w:#c2410c;--ok:#15803d;--bad:#b91c1c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12191d;--tx:#e6edf0;--card:#1b262c;--ln:#5d707a;--c:#4fc3c3;--w:#fb923c;--ok:#4ade80;--bad:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12191d;--tx:#e6edf0;--card:#1b262c;--ln:#5d707a;--c:#4fc3c3;--w:#fb923c;--ok:#4ade80;--bad:#f87171;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:1.1rem/1.5 "Trebuchet MS",sans-serif;padding:1rem;-webkit-user-select:none;user-select:none}
main{max-width:40rem;margin:auto}
h1{font:bold 1.5rem Georgia,serif;margin:.2rem 0 .6rem}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.8rem}
button{font:inherit;cursor:pointer;border:2px solid var(--c);background:var(--card);color:var(--tx);border-radius:.6rem;padding:.45rem .7rem;min-height:2.8rem}
button.on,button.pri{background:var(--c);color:#fff}
.sc{font-size:.95rem;color:var(--ln);margin:.2rem 0 .6rem}
.chips{display:flex;gap:.5rem;margin:.3rem 0}
.chip{flex:1;text-align:center;background:var(--card);border:2px solid var(--ln);border-radius:.6rem;padding:.3rem;font-weight:bold}
.chip.q{border-color:var(--w);color:var(--w);border-style:dashed}
.chip small{display:block;font-weight:normal;font-size:.75rem;color:var(--ln)}
.card{background:var(--card);border-left:6px solid var(--c);border-radius:.5rem;padding:.7rem 1rem;margin:.7rem 0}
.card.w{border-color:var(--w)}
.t{width:2.8rem;height:1.25rem;display:block}
.t[data-src]{touch-action:none;cursor:grab}
.ghost{position:fixed;pointer-events:none;z-index:9;width:3rem;height:1.35rem}
.pool{display:flex;flex-wrap:wrap;gap:.1rem;border:2px dashed var(--ln);border-radius:.6rem;padding:.4rem;min-height:3.2rem;margin:.5rem 0}
.pool .sc{margin:0;align-self:center}
.row{display:flex;flex-wrap:wrap;gap:.7rem;align-items:flex-start;margin:.8rem 0 .4rem}
.it{display:flex;flex-direction:column;align-items:center;width:3.8rem}
.em{font-size:1.8rem;line-height:1.2}
.it small{font-size:.7rem;color:var(--ln);line-height:1.1;margin-bottom:.2rem}
.bx{width:100%;min-height:2.8rem;gap:.12rem;display:flex;flex-direction:column;align-items:center;border:2px solid var(--c);border-radius:.3rem .3rem .8rem .8rem;padding:.3rem 0;background:var(--card)}
.newc{width:3.8rem;min-height:5.5rem;border:2px dashed var(--ln);border-radius:.6rem;display:flex;align-items:center;justify-content:center;text-align:center;font-size:.75rem;line-height:1.2;color:var(--ln);cursor:pointer}
.ctl{display:flex;gap:.5rem;flex-wrap:wrap;margin:.5rem 0}
.ans{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.ans output{font:bold 2rem Georgia,serif;min-width:2.5rem;text-align:center}
.msg{font-weight:bold;margin:.5rem 0}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.eq{font:bold 1.4rem Georgia,serif;margin:.3rem 0}
.pr{font-size:.95rem;color:var(--ln)}
.un{font:bold 1.4rem Georgia,serif}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="fk" viewBox="0 0 56 25"><rect x="1" y="1" width="54" height="23" rx="3" fill="#4b5563" stroke="#1f2937"/><path d="M5 5H51M5 20H51" stroke="#fff" stroke-width="1.4"/><text x="28" y="16" text-anchor="middle" font-size="11" font-weight="bold" font-family="Arial,sans-serif" fill="#fde68a">10 km</text></symbol>
</defs></svg>
<main>
<h1>🚗 De viaje</h1>
<div class="tabs" id="tabs"></div>
<div class="sc" id="sc"></div>
<div id="app"></div>
</main>
<script>
var P=[['coche','🚗',8,12],['autobús','🚌',6,10],['tren','🚆',9,12],['camión','🚚',6,9]];
var S={lv:1,lt:{},ord:[],mode:'mix',ok:0,streak:0,ch:null,c:[],pool:0,ans:0,done:false,rA:false,rB:null};
var $=function(i){return document.getElementById(i)};
var NM={T:'Kilómetros en total',U:'Kilómetros por hora',V:'Horas'};
function R(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function fi(n,s){var o='',i;for(i=0;i<n;i++)o+='<svg class="t"'+(s===null?'':' data-src="'+s+'"')+'><use href="#fk"/></svg>';return o}
function setMode(m){S.mode=m;S.lv=m=='sl'?2:1;next()}
function pk(k,l){if(S.done)return;S.lt[k]=l;draw()}
function idc(v,q){return '<div class="card w"><p style="margin:0 0 .4rem">¿Qué letra (U, V o T) corresponde a cada dato?</p>'+S.ord.map(function(k){return '<div style="display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;margin:.3rem 0"><span style="flex:1;min-width:9rem">'+NM[k]+': <b>'+(k==q?'?':v[k])+'</b></span>'+['U','V','T'].map(function(l){return '<button class="'+(S.lt[k]==l?'on':'')+'" onclick="pk(\''+k+'\',\''+l+'\')">'+l+'</button>'}).join('')+'</div>'}).join('')+'</div>'}
function lc(){return S.lv==1?'':'<p style="margin:.2rem 0">'+(S.rL?'✓':'✗')+' Letras'+(S.rL?'':': '+['T','U','V'].map(function(k){return k+' = '+NM[k]}).join(', '))+'</p>'}
function init(){var h=S.ch,i;S.c=[];S.pool=h.T;
if(h.m=='u')for(i=0;i<h.V;i++)S.c.push(0);
if(h.m=='t'){for(i=0;i<h.V;i++)S.c.push(h.U);S.pool=0}}
var H=[];
function pair(f){var r,k,i=0;do{r=f();k=r[0]+'x'+r[1];i++}while((H.indexOf(k)>=0||r[0]==r[1])&&i<40);H.push(k);if(H.length>10)H.shift();return r}
function next(){
var m=S.mode=='mix'||S.mode=='sl'?['u','v','t'][R(0,2)]:S.mode,p=P[R(0,P.length-1)],r=pair(function(){var u=R(p[2],p[3]);return [u,R(2,Math.min(8,Math.floor(70/u)))]}),U=r[0],V=r[1];
S.ch={m:m,U:U,V:V,T:U*V,p:p};S.done=false;S.lt={};S.ord=['T','U','V'].sort(function(){return Math.random()-.5});S.ans=0;init();draw()}
function move(f,j){if(f<0){if(S.pool<=0)return;S.pool--}else{if(S.c[f]<=0)return;S.c[f]--}S.c[j]++}
function drop(s,el){var f=s=='p'?-1:+s,t=el&&el.closest?el.closest('[data-can],#pool,#newc'):null;
if(t){if(t.id=='pool'){if(f>=0){S.c[f]--;S.pool++}}
else if(t.id=='newc'){S.c.push(0);move(f,S.c.length-1)}
else if(+t.dataset.can!=f)move(f,+t.dataset.can)}
draw()}
var D=null;
function mv(e){if(D){D.g.style.left=e.clientX-24+'px';D.g.style.top=e.clientY-11+'px'}}
document.addEventListener('pointerdown',function(e){var b=e.target.closest&&e.target.closest('.t[data-src]');if(!b||S.done||D)return;
e.preventDefault();var g=b.cloneNode(true);g.removeAttribute('data-src');g.setAttribute('class','ghost');document.body.appendChild(g);
D={s:b.dataset.src,g:g};b.style.opacity=.3;mv(e)});
document.addEventListener('pointermove',mv);
document.addEventListener('pointerup',function(e){if(!D)return;var el=document.elementFromPoint(e.clientX,e.clientY),s=D.s;D.g.remove();D=null;drop(s,el)});
document.addEventListener('pointercancel',function(){if(D){D.g.remove();D=null;draw()}});
function addCan(){if(!S.done){S.c.push(0);draw()}}
function delCan(){if(S.done||!S.c.length)return;S.pool+=S.c.pop();draw()}
function reset(){init();draw()}
function st(d){S.ans=Math.max(0,Math.min(999,S.ans+d));$('an').textContent=S.ans||'?'}
function chk(){var h=S.ch,m=h.m,e=m=='u'?h.U*10:m=='v'?h.V:h.T*10,c0=S.c[0];
S.rA=S.ans==e;
S.rB=m=='u'?(S.pool==0&&S.c.every(function(x){return x==c0})):m=='v'?(S.pool==0&&S.c.length==h.V&&S.c.every(function(x){return x==h.U})):null;
S.rL=['T','U','V'].every(function(k){return S.lt[k]==k});S.done=true;if(S.rA&&S.rB!==false&&(S.lv==1||S.rL)){S.ok++;S.streak++}else S.streak=0;draw()}
function draw(){var h=S.ch,m=h.m,q={u:'U',v:'V',t:'T'}[m],U=h.U*10,T=h.T*10,e={u:U,v:h.V,t:T}[m],g=h.p,em='🕐',o='',a=S.rA,b=S.rB,good=a&&b!==false&&(S.lv==1||S.rL);
var vals={U:U+' km/h',V:h.V+' h',T:T+' km'};
if(S.lv==1||S.done)o+='<div class="chips">'+['T','U','V'].map(function(k){return '<div class="chip'+(k==q?' q':'')+'"><small>'+{T:'kilómetros en total',U:'kilómetros por hora',V:'horas'}[k]+'</small>'+k+' = '+(k==q&&!S.done?'?':vals[k])+'</div>'}).join('')+'</div>';
var pool='<div class="pool" id="pool">'+(S.pool?fi(S.pool,'p'):'<span class="sc">'+(m=='t'?'Cuentakilómetros: aquí van los trozos de camino que saques':'Kilómetros')+'</span>')+'</div>';
var row='<div class="row">'+S.c.map(function(x,j){return '<span class="it" data-can="'+j+'"><span class="em">'+em+'</span><small>1 hora</small><span class="bx">'+fi(x,j)+'</span></span>'}).join('')+(m=='v'?'<span class="newc" id="newc" onclick="addCan()">+<br>hora<br>nueva</span>':'')+'</div>';
var txt={u:g[1]+' Un '+g[0]+' ha recorrido '+T+' km en '+h.V+' horas, siempre a la misma velocidad. ¿A cuántos <b>km/h</b> va?<br><i class="pr">(Reparte los kilómetros entre las horas: arrastra los trozos de camino a cada reloj.)</i>',
v:g[1]+' Un '+g[0]+' tiene que recorrer '+T+' km yendo a '+U+' km/h. ¿Cuántas horas tarda?<br><i class="pr">(Coloca los kilómetros en los relojes, hora a hora, arrastrando los trozos de camino. Si necesitas otra hora, suéltalos en «hora nueva».)</i>',
t:g[1]+' Un '+g[0]+' va a '+U+' km/h durante '+h.V+' horas. ¿Cuántos kilómetros recorre en total?<br><i class="pr">(Lleva los kilómetros de cada hora al cuentakilómetros y cuéntalos.)</i>'}[m];
o+='<div class="card"><p style="margin:0">'+txt+'</p>'+(m=='t'?row+pool:pool+row);
if(!S.done)o+='<div class="ctl">'+(m=='v'?'<button onclick="delCan()">Quitar hora</button>':'')+'<button onclick="reset()">Empezar de nuevo</button></div>';
o+='</div>'+(S.lv==2&&!S.done?idc(vals,q):'')+'<div class="card w">';
if(!S.done){var sp={u:[100,10],v:[1],t:[100,10]}[m],bt=function(d){return '<button onclick="st('+d+')">'+(d<0?'−':'+')+Math.abs(d)+'</button>'};
o+='<p style="margin:0 0 .4rem">'+(S.lv==1?'¿Cuánto vale <b>'+q+'</b>?':'Tu respuesta:')+''+{u:' (km/h)',v:' (horas)',t:' (km en total)'}[m]+'</p><div class="ans">'+sp.map(function(s){return bt(-s)}).join('')+'<output id="an">'+(S.ans||'?')+'</output>'+sp.slice().reverse().map(bt).join('')+'<span class="un">'+(m=='v'?'h':m=='u'?'km/h':'km')+'</span></div><div class="ctl"><button class="pri" onclick="chk()">Terminar</button></div><p class="sc">Cuando creas que lo tienes, escribe la respuesta y pulsa Terminar.</p>'}
else{o+='<p class="msg '+(good?'ok':'bad')+'">'+(good?'¡Muy bien!':'Esta vez no ha salido. Fíjate en la explicación.')+'</p>';
if(b!==null)o+='<p style="margin:.2rem 0">'+(b?'✓':'✗')+' Reparto de los kilómetros'+(b?'':m=='u'?': no hay los mismos kilómetros en cada hora, o quedan kilómetros sin colocar':': tendría que haber '+h.V+' horas con '+h.U+' trozos de camino cada una')+'</p>';
o+=lc()+'<p style="margin:.2rem 0">'+(a?'✓':'✗')+' Respuesta: '+q+' = '+e+(m=='v'?' h':m=='u'?' km/h':' km')+(a?'':' (tú pusiste '+(S.ans||'nada')+')')+'</p><div class="eq">'+(m=='t'?'T = U × V → '+U+' km/h × '+h.V+' h = '+T+' km':m=='u'?'U = T ÷ V → '+T+' km ÷ '+h.V+' h = '+U+' km/h':'V = T ÷ U → '+T+' km ÷ '+U+' km/h = '+h.V+' horas')+'</div><p style="margin:.2rem 0">A '+U+' km/h, en '+h.V+' horas se recorren '+T+' km.</p><p style="margin:.2rem 0">Cada trozo de camino son 10 km: '+h.U+' trozos × '+h.V+' horas = '+h.T+' trozos = '+T+' km.</p>'+(m=='t'?'':'<p style="margin:.2rem 0">Comprobación con la multiplicación: U × V = T → '+U+' km/h × '+h.V+' h = '+T+' km.</p>')+'<div class="row">'+Array(h.V+1).join('<span class="it"><span class="em">'+em+'</span><small>1 hora</small><span class="bx">'+fi(h.U,null)+'</span></span>')+'</div><div class="ctl"><button class="pri" onclick="next()">Siguiente ▶</button></div>'}
$('app').innerHTML=o+'</div>';
$('tabs').innerHTML=[['mix','🎲 Mezcla'],['u','Busca U'],['v','Busca V'],['t','Busca T'],['sl','🔍 Sin letras']].map(function(x){return '<button class="'+(S.mode==x[0]?'on':'')+'" onclick="setMode(\''+x[0]+'\')">'+x[1]+'</button>'}).join('');
$('sc').textContent='Aciertos: '+S.ok+' · Racha: '+S.streak}
next();
</script>
</body></html>
